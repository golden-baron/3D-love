<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Love Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a0510 0%, #05000a 70%, #000000 100%);
  }
  canvas { display: block; }
  #caption {
    position: fixed;
    bottom: 24px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ff6b9d;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.7;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(255, 60, 120, 0.6);
  }
</style>
</head>
<body>
<div id="caption">♥ ROTATING LOVE ♥</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ----- Scene setup -----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 55);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // ----- Build 2D heart outline (math heart curve) -----
  function heartShape(scale) {
    const shape = new THREE.Shape();
    const x = 0, y = 0;
    shape.moveTo(x + 5 * scale, y + 5 * scale);
    shape.bezierCurveTo(x + 5 * scale, y + 5 * scale, x + 4 * scale, y, x, y);
    shape.bezierCurveTo(x - 6 * scale, y, x - 6 * scale, y + 7 * scale, x - 6 * scale, y + 7 * scale);
    shape.bezierCurveTo(x - 6 * scale, y + 11 * scale, x - 3 * scale, y + 15.4 * scale, x + 5 * scale, y + 19 * scale);
    shape.bezierCurveTo(x + 12 * scale, y + 15.4 * scale, x + 16 * scale, y + 11 * scale, x + 16 * scale, y + 7 * scale);
    shape.bezierCurveTo(x + 16 * scale, y + 7 * scale, x + 16 * scale, y, x + 10 * scale, y);
    shape.bezierCurveTo(x + 7 * scale, y, x + 5 * scale, y + 5 * scale, x + 5 * scale, y + 5 * scale);
    return shape;
  }

  const extrudeSettings = {
    depth: 4,
    bevelEnabled: true,
    bevelThickness: 1.2,
    bevelSize: 1,
    bevelSegments: 6,
    curveSegments: 32
  };

  const shape = heartShape(1.6);
  const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geometry.center();
  geometry.rotateZ(Math.PI); // flip so the point faces down

  const material = new THREE.MeshPhysicalMaterial({
    color: 0xff2255,
    emissive: 0x550014,
    metalness: 0.35,
    roughness: 0.25,
    clearcoat: 0.6,
    clearcoatRoughness: 0.2,
    reflectivity: 0.6
  });

  const heart = new THREE.Mesh(geometry, material);
  scene.add(heart);

  // Wireframe glow shell for extra pop
  const wireGeo = geometry.clone();
  const wireMat = new THREE.MeshBasicMaterial({ color: 0xff8fb3, wireframe: true, transparent: true, opacity: 0.15 });
  const wireHeart = new THREE.Mesh(wireGeo, wireMat);
  wireHeart.scale.setScalar(1.03);
  heart.add(wireHeart);

  // ----- Lights -----
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const key = new THREE.PointLight(0xff5588, 2.2, 200);
  key.position.set(30, 30, 40);
  scene.add(key);

  const rim = new THREE.PointLight(0x66aaff, 1.2, 200);
  rim.position.set(-40, -20, -30);
  scene.add(rim);

  const fill = new THREE.PointLight(0xffffff, 0.6, 200);
  fill.position.set(0, -40, 30);
  scene.add(fill);

  // ----- Particle sparkles around the heart -----
  const particleCount = 400;
  const particleGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    const radius = 30 + Math.random() * 25;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({
    color: 0xff9bc2,
    size: 0.6,
    transparent: true,
    opacity: 0.8,
    depthWrite: false
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  // ----- Animation loop -----
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    heart.rotation.y = t * 0.8;
    heart.rotation.x = Math.sin(t * 0.5) * 0.15;

    const pulse = 1 + Math.sin(t * 2.5) * 0.06;
    heart.scale.setScalar(pulse);

    particles.rotation.y = -t * 0.05;
    particles.rotation.x = t * 0.02;

    key.intensity = 2.0 + Math.sin(t * 3) * 0.4;

    renderer.render(scene, camera);
  }
  animate();

  // ----- Responsive resize -----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
